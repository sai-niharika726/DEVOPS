<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA Store — Premium Electronics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --card: #1a1a24; --border: #2a2a3a;
      --accent: #6c63ff; --accent-glow: rgba(108,99,255,0.3); --accent2: #00d4aa;
      --text: #f0f0f8; --muted: #7a7a9a; --success: #00d4aa; --danger: #ff4d6d;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px;
    }
    .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .cart-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 0.5rem 1.2rem; border-radius: 8px; cursor: pointer;
      font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem;
      transition: border-color 0.2s;
    }
    .cart-btn:hover { border-color: var(--accent); }
    .cart-count {
      background: var(--accent); color: white; font-size: 0.7rem; font-weight: 700;
      border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    }

    /* HERO */
    .hero {
      padding: 5rem 2rem 3rem; text-align: center; position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(108,99,255,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-tag {
      display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--accent);
      border: 1px solid var(--accent-glow); padding: 0.35rem 1rem; border-radius: 100px; margin-bottom: 1.5rem;
    }
    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 700;
      line-height: 1.1; letter-spacing: -1.5px; margin-bottom: 1rem;
    }
    .hero h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--muted); font-size: 1.05rem; max-width: 480px; margin: 0 auto 2.5rem; line-height: 1.6; }

    /* SEARCH */
    .search-wrap { max-width: 460px; margin: 0 auto 2.5rem; display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color 0.2s; }
    .search-wrap:focus-within { border-color: var(--accent); }
    .search-wrap input { flex:1; background:none; border:none; outline:none; color:var(--text); font-size:0.95rem; padding:0.85rem 1.2rem; }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap button { background: var(--accent); border:none; color:white; padding:0 1.4rem; cursor:pointer; font-size:0.9rem; font-weight:500; }

    /* STATS */
    .stats { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; padding: 0 2rem 3.5rem; }
    .stat { text-align: center; }
    .stat-n { font-family: 'Space Grotesk',sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    .stat-l { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }
    .divider { width: 1px; background: var(--border); }

    /* CATEGORIES */
    .cats { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 0 2rem 2.5rem; }
    .cat {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 0.42rem 1.1rem; border-radius: 100px; cursor: pointer;
      font-size: 0.84rem; font-weight: 500; transition: all 0.2s;
    }
    .cat:hover, .cat.active { background: var(--accent); border-color: var(--accent); color: white; }

    /* GRID */
    .section { padding: 0 2rem 5rem; max-width: 1400px; margin: 0 auto; }
    .sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.4rem; }
    .sec-title { font-family: 'Space Grotesk',sans-serif; font-size: 1.3rem; font-weight: 700; }
    .sec-count { color: var(--muted); font-size: 0.84rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(265px,1fr)); gap: 1.2rem; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; cursor: pointer; transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 32px rgba(108,99,255,0.18); }
    .card img { width: 100%; height: 200px; object-fit: cover; background: var(--surface); display: block; }
    .card-body { padding: 1.2rem; }
    .card-cat { font-size: 0.7rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 0.35rem; }
    .card-name { font-weight: 600; font-size: 0.95rem; line-height: 1.4; margin-bottom: 0.5rem; }
    .card-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.5; margin-bottom: 0.9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; }
    .price { font-family: 'Space Grotesk',sans-serif; font-size: 1.15rem; font-weight: 700; }
    .badge { font-size: 0.7rem; font-weight: 500; padding: 0.2rem 0.6rem; border-radius: 100px; }
    .ok  { background: rgba(0,212,170,.15); color: var(--success); }
    .low { background: rgba(255,77,109,.15); color: var(--danger); }
    .add-btn {
      width: 100%; margin-top: 0.9rem; background: var(--accent); border: none; color: white;
      padding: 0.65rem; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
      transition: opacity 0.2s;
    }
    .add-btn:hover { opacity: 0.85; }

    /* SKELETON */
    .skel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(265px,1fr)); gap: 1.2rem; }
    .skel-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .skel-img  { height: 200px; background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sh 1.4s infinite; }
    .skel-body { padding: 1.2rem; }
    .skel-line { height: 11px; border-radius: 6px; background: var(--surface); margin-bottom: 0.75rem; }
    .skel-line.s { width: 55%; }
    @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* MODAL */
    .overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.72); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 1rem;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto;
      transform: scale(0.95); transition: transform 0.2s;
    }
    .overlay.open .modal { transform: scale(1); }
    .modal img { width: 100%; height: 250px; object-fit: cover; border-radius: 16px 16px 0 0; display: block; }
    .modal-body { padding: 1.5rem; }
    .m-cat  { font-size: 0.7rem; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); margin-bottom:0.4rem; }
    .m-name { font-family:'Space Grotesk',sans-serif; font-size:1.45rem; font-weight:700; margin-bottom:0.4rem; }
    .m-desc { color:var(--muted); font-size:0.88rem; line-height:1.6; margin-bottom:1.1rem; }
    .m-price { font-family:'Space Grotesk',sans-serif; font-size:1.9rem; font-weight:700; margin-bottom:1.4rem; }
    .m-price span { font-size:0.95rem; color:var(--muted); font-family:'Inter',sans-serif; font-weight:400; }
    .fg { margin-bottom:0.9rem; }
    .fg label { display:block; font-size:0.78rem; font-weight:500; color:var(--muted); margin-bottom:0.35rem; }
    .fg input {
      width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px;
      color:var(--text); font-size:0.9rem; padding:0.68rem 1rem; outline:none; transition:border-color 0.2s;
    }
    .fg input:focus { border-color: var(--accent); }
    .qty-row { display:flex; gap:0.5rem; align-items:center; margin-bottom:1.2rem; }
    .qb {
      background:var(--surface); border:1px solid var(--border); color:var(--text);
      width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:1.1rem;
      display:flex; align-items:center; justify-content:center; transition:border-color 0.2s;
    }
    .qb:hover { border-color:var(--accent); }
    .qn { font-weight:600; min-width:2rem; text-align:center; }
    .m-actions { display:flex; gap:0.75rem; }
    .btn-p {
      flex:1; background:var(--accent); border:none; color:white;
      padding:0.85rem; border-radius:12px; cursor:pointer; font-size:0.95rem; font-weight:600;
      transition:opacity 0.2s;
    }
    .btn-p:hover { opacity:0.85; }
    .btn-s {
      background:var(--surface); border:1px solid var(--border); color:var(--muted);
      padding:0.85rem 1.2rem; border-radius:12px; cursor:pointer; transition:border-color 0.2s;
    }
    .btn-s:hover { border-color:var(--muted); }

    /* CART */
    .cart-panel {
      position:fixed; top:0; right:-400px; z-index:300;
      width:370px; height:100vh; background:var(--card); border-left:1px solid var(--border);
      transition:right 0.3s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column;
    }
    .cart-panel.open { right:0; }
    .cp-head {
      padding:1.4rem 1.5rem; border-bottom:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:center;
    }
    .cp-title { font-family:'Space Grotesk',sans-serif; font-size:1.15rem; font-weight:700; }
    .x-btn {
      background:var(--surface); border:1px solid var(--border); color:var(--muted);
      width:34px; height:34px; border-radius:8px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .cp-items { flex:1; overflow-y:auto; padding:1rem 1.5rem; }
    .empty { text-align:center; color:var(--muted); padding:3rem 0; font-size:0.88rem; }
    .ci { display:flex; gap:1rem; padding:0.9rem 0; border-bottom:1px solid var(--border); align-items:center; }
    .ci img { width:58px; height:58px; border-radius:10px; object-fit:cover; }
    .ci-info { flex:1; }
    .ci-name  { font-size:0.84rem; font-weight:500; margin-bottom:0.2rem; }
    .ci-price { font-size:0.78rem; color:var(--muted); }
    .ci-rm { background:none; border:none; color:var(--danger); cursor:pointer; font-size:1rem; }
    .cp-foot { padding:1.4rem 1.5rem; border-top:1px solid var(--border); }
    .cp-total { display:flex; justify-content:space-between; font-weight:600; margin-bottom:1rem; }
    .checkout-btn {
      width:100%; background:linear-gradient(135deg, var(--accent), var(--accent2));
      border:none; color:white; padding:0.95rem; border-radius:12px;
      cursor:pointer; font-size:1rem; font-weight:600;
    }
    .backdrop {
      position:fixed; inset:0; z-index:250; background:rgba(0,0,0,.5);
      opacity:0; pointer-events:none; transition:opacity 0.3s;
    }
    .backdrop.open { opacity:1; pointer-events:all; }

    /* TOAST */
    .toast {
      position:fixed; bottom:2rem; right:2rem; z-index:500;
      background:var(--card); border:1px solid var(--border); border-radius:12px;
      padding:0.9rem 1.4rem; display:flex; align-items:center; gap:0.75rem;
      font-size:0.88rem; font-weight:500;
      transform:translateY(80px); opacity:0; transition:all 0.3s; max-width:300px;
    }
    .toast.show { transform:translateY(0); opacity:1; }

    @media(max-width:600px){
      .cart-panel{width:100%;right:-100%}
      .stats{gap:1.2rem}
      .divider{display:none}
    }
  </style>
</head>
<body>

<nav>
  <div class="logo">NOV<span>A</span></div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Cart <span class="cart-count" id="cartCount">0</span>
  </button>
</nav>

<section class="hero">
  <div class="hero-tag">Free shipping on orders over $99</div>
  <h1>Next-Gen Tech,<br><span>Delivered Fast</span></h1>
  <p>Premium electronics handpicked for creators, engineers, and power users.</p>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search products…" oninput="handleSearch()" />
    <button onclick="handleSearch()">Search</button>
  </div>
</section>

<div class="stats">
  <div class="stat"><div class="stat-n">500+</div><div class="stat-l">Products</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="stat-n">50K+</div><div class="stat-l">Customers</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="stat-n">4.9★</div><div class="stat-l">Avg Rating</div></div>
  <div class="divider"></div>
  <div class="stat"><div class="stat-n">24h</div><div class="stat-l">Support</div></div>
</div>

<div class="cats" id="cats"></div>

<section class="section">
  <div class="sec-head">
    <div class="sec-title">Products</div>
    <div class="sec-count" id="cnt"></div>
  </div>
  <div id="grid"></div>
</section>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="modal">
    <img id="mImg" src="" alt="" onerror="this.src='https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=400'" />
    <div class="modal-body">
      <div class="m-cat"  id="mCat"></div>
      <div class="m-name" id="mName"></div>
      <div class="m-desc" id="mDesc"></div>
      <div class="m-price" id="mPrice"></div>
      <div class="fg"><label>Your Name</label><input id="oName" type="text" placeholder="e.g. Sai K" /></div>
      <div class="fg"><label>Email</label><input id="oEmail" type="email" placeholder="you@example.com" /></div>
      <div style="margin-bottom:1.1rem">
        <label style="font-size:0.78rem;font-weight:500;color:var(--muted);display:block;margin-bottom:0.5rem">Quantity</label>
        <div class="qty-row">
          <button class="qb" onclick="changeQty(-1)">−</button>
          <span class="qn" id="qn">1</span>
          <button class="qb" onclick="changeQty(1)">+</button>
        </div>
      </div>
      <div class="m-actions">
        <button class="btn-p" onclick="placeOrder()">Place Order</button>
        <button class="btn-s" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- CART PANEL -->
<div class="backdrop" id="backdrop" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cp-head">
    <div class="cp-title">Your Cart</div>
    <button class="x-btn" onclick="toggleCart()">✕</button>
  </div>
  <div class="cp-items" id="cpItems"></div>
  <div id="cpFoot" style="display:none" class="cp-foot">
    <div class="cp-total"><span>Total</span><span id="cpTotal"></span></div>
    <button class="checkout-btn">Checkout →</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span id="toastIcon"></span><span id="toastMsg"></span>
</div>

<script>
  // Change this to your backend URL when running
  const API = 'http://localhost:5000/api';

  let products = [], filtered = [], activecat = 'All', cur = null, qty = 1, cart = [];

  async function init() {
    showSkel();
    await Promise.all([loadCats(), loadProducts()]);
  }

  function showSkel() {
    document.getElementById('grid').innerHTML =
      `<div class="skel-grid">${Array(8).fill(`<div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line s"></div><div class="skel-line"></div><div class="skel-line"></div></div></div>`).join('')}</div>`;
  }

  async function loadCats() {
    try {
      const r = await fetch(`${API}/categories`);
      renderCats(await r.json());
    } catch(e) {}
  }

  function renderCats(cats) {
    document.getElementById('cats').innerHTML = cats.map(c =>
      `<button class="cat ${c===activecat?'active':''}" onclick="filterCat('${c}')">${c}</button>`
    ).join('');
  }

  async function loadProducts(cat='All') {
    try {
      const url = cat==='All' ? `${API}/products` : `${API}/products?category=${encodeURIComponent(cat)}`;
      products = await (await fetch(url)).json();
      filtered = [...products];
      render(filtered);
    } catch(e) {
      document.getElementById('grid').innerHTML = `<div style="text-align:center;color:var(--muted);padding:4rem">
        <div style="font-size:2rem;margin-bottom:1rem">⚠️</div>
        <div>Backend not reachable.<br>Make sure Flask is running on port 5000.</div>
      </div>`;
    }
  }

  function render(list) {
    document.getElementById('cnt').textContent = `${list.length} item${list.length!==1?'s':''}`;
    if (!list.length) {
      document.getElementById('grid').innerHTML = `<div style="text-align:center;color:var(--muted);padding:4rem">No products found.</div>`;
      return;
    }
    document.getElementById('grid').innerHTML = `<div class="grid">${list.map(p => `
      <div class="card" onclick="openModal(${p.id})">
        <img src="${p.image_url}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=400'" />
        <div class="card-body">
          <div class="card-cat">${p.category}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.description}</div>
          <div class="card-foot">
            <div class="price">$${parseFloat(p.price).toFixed(2)}</div>
            <span class="badge ${p.stock>5?'ok':'low'}">${p.stock>5?'In Stock':p.stock>0?`Only ${p.stock} left`:'Out of Stock'}</span>
          </div>
          <button class="add-btn" onclick="event.stopPropagation();openModal(${p.id})">View & Order</button>
        </div>
      </div>`).join('')}</div>`;
  }

  function filterCat(cat) {
    activecat = cat;
    document.querySelectorAll('.cat').forEach(b => b.classList.toggle('active', b.textContent===cat));
    loadProducts(cat);
  }

  function handleSearch() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    filtered = products.filter(p =>
      p.name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)
    );
    render(filtered);
  }

  function openModal(id) {
    const p = products.find(x => x.id===id);
    if (!p) return;
    cur = p; qty = 1;
    document.getElementById('mImg').src   = p.image_url;
    document.getElementById('mCat').textContent  = p.category;
    document.getElementById('mName').textContent = p.name;
    document.getElementById('mDesc').textContent = p.description;
    document.getElementById('mPrice').innerHTML  = `$${parseFloat(p.price).toFixed(2)} <span>per unit</span>`;
    document.getElementById('qn').textContent = 1;
    document.getElementById('oName').value  = '';
    document.getElementById('oEmail').value = '';
    document.getElementById('overlay').classList.add('open');
  }

  function closeOverlay(e) { if (e.target===document.getElementById('overlay')) closeModal(); }
  function closeModal() { document.getElementById('overlay').classList.remove('open'); cur=null; }

  function changeQty(d) {
    qty = Math.max(1, Math.min(cur?.stock||99, qty+d));
    document.getElementById('qn').textContent = qty;
  }

  async function placeOrder() {
    const name  = document.getElementById('oName').value.trim();
    const email = document.getElementById('oEmail').value.trim();
    if (!name||!email) { toast('Fill in your name and email','⚠️'); return; }
    if (!email.includes('@')) { toast('Enter a valid email','⚠️'); return; }
    try {
      const res = await fetch(`${API}/orders`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({customer_name:name,customer_email:email,product_id:cur.id,quantity:qty})
      });
      const data = await res.json();
      if (!res.ok) { toast(data.error||'Order failed','❌'); return; }
      addToCart(cur, qty);
      closeModal();
      toast(`Order placed! Total: $${data.total.toFixed(2)}`,'✅');
      loadProducts(activecat);
    } catch(e) { toast('Cannot reach backend','❌'); }
  }

  function addToCart(p, q) {
    const ex = cart.find(i=>i.id===p.id);
    ex ? ex.quantity+=q : cart.push({...p,quantity:q});
    updateCart();
  }

  function removeFromCart(id) { cart=cart.filter(i=>i.id!==id); updateCart(); }

  function updateCart() {
    const total = cart.reduce((s,i)=>s+i.price*i.quantity,0);
    document.getElementById('cartCount').textContent = cart.reduce((s,i)=>s+i.quantity,0);
    const items = document.getElementById('cpItems');
    const foot  = document.getElementById('cpFoot');
    if (!cart.length) {
      items.innerHTML = '<div class="empty">🛒<br><br>Your cart is empty</div>';
      foot.style.display = 'none';
    } else {
      items.innerHTML = cart.map(i=>`
        <div class="ci">
          <img src="${i.image_url}" alt="${i.name}" onerror="this.src='https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=400'"/>
          <div class="ci-info">
            <div class="ci-name">${i.name}</div>
            <div class="ci-price">×${i.quantity} — $${(i.price*i.quantity).toFixed(2)}</div>
          </div>
          <button class="ci-rm" onclick="removeFromCart(${i.id})">✕</button>
        </div>`).join('');
      document.getElementById('cpTotal').textContent = `$${total.toFixed(2)}`;
      foot.style.display = 'block';
    }
  }

  function toggleCart() {
    document.getElementById('cartPanel').classList.toggle('open');
    document.getElementById('backdrop').classList.toggle('open');
  }

  function toast(msg, icon='✓') {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent  = msg;
    document.getElementById('toastIcon').textContent = icon;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 3500);
  }

  init();
</script>
</body>
</html>
